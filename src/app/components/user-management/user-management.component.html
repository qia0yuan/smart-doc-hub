<div class="user-management-container">
    <div class="flex gap-3 justify-content-end mb-3">
        <p-button label="Create" (click)="profileAction('Create')"></p-button>
        <p-button label="Update" (click)="profileAction('Update')"></p-button>
        <p-button label="Delete" (click)="onDelete"></p-button>
    </div>
    <div class="card">
        <p-table
            [value]="users"
            [(selection)]="selectedUsers"
            dataKey="id"
            [tableStyle]="{'min-width': '50rem'}">
                <ng-template #header>
                    <tr>
                        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                        <th>Account ID</th>
                        <th>Name</th>
                        <th>Address 1</th>
                        <th>Address 2</th>
                        <th>Email ID</th>
                        <th>Telephone</th>
                        <th>Created By</th>
                        <th>Updated By</th>
                        <th>Primary Contact</th>
                        <th>Secondary Contact</th>
                    </tr>
                </ng-template>
                <ng-template #body let-user>
                    <tr>
                        <td>
                            <p-tableCheckbox [value]="user" />
                        </td>
                        <td>{{user.id}}</td>
                        <td>{{user.name}}</td>
                        <td>{{user.address1}}</td>
                        <td>{{user.address2}}</td>
                        <td>{{user.emailid}}</td>
                        <td>{{user.phonenumber}}</td>
                        <td>{{user.createdby}}</td>
                        <td>{{user.updatedby}}</td>
                        <td>{{user.primarycontact}}</td>
                        <td>{{user.secondarycontact}}</td>
                    </tr>
                </ng-template>
        </p-table>
    </div>
</div>
<app-profile [action]="action()" (closed)="action.set('')"></app-profile>
